name: ProTrader scans (cloud cron)

# 24x7 cloud scanner + real-time Telegram alerts. Times UTC; IST = UTC + 5:30.
on:
  schedule:
    # Public repo → Actions is FREE, so we run DENSE for near-real-time updates. GitHub still drops
    # some scheduled runs (best-effort), so density + self-heal + the Vercel daily cron (backup)
    # together keep it fully automatic with no manual steps. Times UTC; IST = UTC + 5:30.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 3-10 * * 1-5'   # EVERY 5 MIN during live market (≈08:32–16:00 IST): :02/:17/:32/:47 = full intraday scan (new signals); the other ticks = FAST execute-only (honor stops + square-off in ~30s, so runs are cheap and rarely dropped)
    - cron: '1,6 10 * * 1-5'            # DEDICATED post-close SQUARE-OFF (15:31 & 15:36 IST) — guarantees Daily-Income is flat right after 15:30 even if a cron run is dropped
    - cron: '7,37 10-16 * * 1-5'        # every 30 min after-market (≈16:07–22:07 IST)
    - cron: '2 12 * * 1-5'              # post-market daily close + weekly + self-improve (~17:32 IST)
    - cron: '32 12 * * 1-5'             # BACKUP self-improve (~18:02 IST) — catches up if the 17:32 run was dropped (staleness-guarded → never double-runs)
  workflow_dispatch:               # manual (Actions tab or in-app ScanNow)
    inputs:
      tf:
        description: 'auto/daily/weekly/intraday'
        required: false
        default: 'auto'

permissions:
  contents: write                  # persist state (ledger/goal/tuning/tg_sent) back to repo

concurrency:
  group: protrader-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Write .env from secrets
        run: |
          cat > .env <<'EOF'
          ANGEL_API_KEY=${{ secrets.ANGEL_API_KEY }}
          ANGEL_SECRET_KEY=${{ secrets.ANGEL_SECRET_KEY }}
          ANGEL_TOTP_SECRET=${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_CLIENT_CODE=${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN=${{ secrets.ANGEL_MPIN }}
          ALPHA_VANTAGE_KEY=${{ secrets.ALPHA_VANTAGE_KEY }}
          TWELVE_DATA_KEY=${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}
          EOF
      - name: Run scan by session (sends Telegram alerts for new signals)
        run: |
          TF="${{ github.event.inputs.tf }}"
          H=$((10#$(date -u +%H))); MIN=$((10#$(date -u +%M)))
          if [ -n "$TF" ] && [ "$TF" != "auto" ]; then
            case "$TF" in
              execute)  node scripts/screener.mjs --execute ;;
              intraday) node scripts/screener.mjs --tf intraday --full ;;
              weekly)   node scripts/screener.mjs --tf weekly --full ;;
              *)        node scripts/screener.mjs --full --top 80 --improve ;;
            esac
          elif [ "$H" -eq 12 ] && [ "$MIN" -lt 45 ]; then
            echo "POST-MARKET ~17:30–18:05 IST — full daily close + weekly + self-improvement (17:32 run + 18:02 backup; self-improve is staleness-guarded so it runs once/day)"
            node scripts/screener.mjs --full --top 80 --improve
            node scripts/screener.mjs --tf weekly --full
          else
            # DAILY board refreshes ONCE/day automatically: the first market-hours run that finds a
            # stale board (date != today) runs the full daily; every other run is a live intraday scan.
            TODAY=$(date -u +%F)
            BOARD_DATE=$(node -e "try{process.stdout.write(String(require('./public/board.json').date||''))}catch(e){process.stdout.write('')}")
            if [ "$BOARD_DATE" != "$TODAY" ] && [ "$H" -ge 4 ]; then
              echo "AUTO DAILY — board stale ($BOARD_DATE != $TODAY) → full daily + self-improve"
              node scripts/screener.mjs --full --top 80 --improve
              echo "LIVE — first intraday scan of the FULL NSE universe"
              node scripts/screener.mjs --tf intraday --full
            elif [ $((MIN % 15)) -eq 2 ]; then
              echo "LIVE (:02/:17/:32/:47) — full intraday scan of the NSE universe + Telegram alerts + new entries"
              node scripts/screener.mjs --tf intraday --full
            else
              echo "EXECUTE-ONLY (off-15 tick) — fast run: price open positions, honor stops, square-off Daily (~30s)"
              node scripts/screener.mjs --execute
            fi
          fi
      - name: Persist state back to repo (accumulates ledger/goal, dedups Telegram)
        run: |
          git config user.name "protrader-bot"
          git config user.email "bot@stocksbyvarsha.local"
          git add public/ledger.json public/goal.json public/tuning.json public/tg_sent.json public/track_record.json public/board*.json public/learning.json public/news.json public/delivery.json public/delivery_history.json public/trade_book.json public/fii_history.json public/oi_history.json public/picks.json public/cas.json 2>/dev/null || true
          git commit -m "state $(date -u +%FT%RZ)" || echo "no state changes"
          # CRITICAL: never LOSE dedup/book state to a push race, AND never leave conflict markers in the
          # working tree (the OLD `pull --rebase --autostash` did on JSON conflicts → the deploy shipped
          # corrupted board.json). Rebase with -X theirs so state conflicts auto-resolve to the FRESH local
          # data (this scan just generated it), and ABORT on any failure so the tree is always clean.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --strategy-option=theirs origin/main; then
              git push && { echo "state pushed"; break; }
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push race — retry $i"; sleep 4
          done
          # hard safety: if anything left markers, discard them so the deploy can never ship a corrupt file
          if grep -rl '^<<<<<<< ' public/*.json >/dev/null 2>&1; then echo "markers found — restoring clean state"; git checkout -- public/ ; fi
      - name: Deploy to Vercel (tradingview project → stocksbyvarsha.vercel.app)
        run: |
          npx --yes vercel@latest link --yes --project tradingview --scope vishalcurators-projects --token=${{ secrets.VERCEL_TOKEN }}
          npx --yes vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
